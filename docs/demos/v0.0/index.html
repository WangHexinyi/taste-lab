<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V0.0 · Prompt-only archive · Taste Lab</title>
  <style>
    :root { color-scheme: dark; --bg:#151512; --ink:#ebe5d9; --muted:#989186; --line:rgba(235,229,217,.16); --accent:#8f9a84; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:32px; background:radial-gradient(circle at 70% 20%,rgba(143,154,132,.18),transparent 30rem),var(--bg); color:var(--ink); font-family:ui-sans-serif,system-ui,sans-serif; }
    main { width:min(760px,100%); padding:clamp(32px,7vw,72px); border:1px solid var(--line); background:rgba(20,20,17,.72); }
    .label { color:var(--accent); letter-spacing:.16em; text-transform:uppercase; font-size:12px; }
    h1 { margin:18px 0 24px; font:400 clamp(46px,9vw,90px)/.95 Georgia,serif; letter-spacing:-.05em; }
    p { max-width:610px; color:var(--muted); font-size:18px; line-height:1.7; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:34px; }
    a { padding:12px 16px; border:1px solid var(--line); border-radius:999px; color:var(--ink); text-decoration:none; font-size:13px; }
    a:first-child { background:var(--ink); color:var(--bg); }
  </style>
</head>
<body>
  <main>
    <div class="label">V0.0 · Provenance note</div>
    <h1>The prompt before the proof.</h1>
    <p>V0.0 原始文件夹只包含 <strong>TasteSkill.md</strong>，没有 HTML 演示。为了不把其他版本的输出伪装成 V0.0，这一页只记录真实状态，并把你带回原稿。</p>
    <div class="actions">
      <a href="https://github.com/WangHexinyi/taste-lab/blob/main/archive/v0.0/TasteSkill.md">阅读 V0.0 原稿</a>
      <a href="../../">返回五代展厅</a>
    </div>
  </main>
</body>
</html>
